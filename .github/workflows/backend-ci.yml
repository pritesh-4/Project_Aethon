name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[cnn]"

      - name: Check code formatting (Ruff)
        run: ruff format --check .

      - name: Lint codebase (Ruff)
        run: ruff check .

      - name: Static type checking (Mypy)
        run: mypy app

      - name: Run automated tests (Pytest)
        run: python -m pytest -v --junitxml=junit.xml

      - name: Import and application smoke test
        run: |
          python -c "from app.main import create_app; from fastapi.testclient import TestClient; client = TestClient(create_app()); res = client.get('/health'); assert res.status_code == 200 and res.json()['status'] == 'healthy'; print('Smoke test passed:', res.json())"

      - name: Scientific benchmark generation smoke test
        run: |
          python scripts/generate_synthetic_benchmark.py --output-dir /tmp/synthetic_smoke --seed 42 --dataset-id ci_smoke --verify

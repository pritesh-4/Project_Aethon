name: Integration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connectivity-audit:
    name: Frontend-FastAPI Integration & Connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -e backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate synthetic benchmark fixture for integration
        run: |
          mkdir -p /tmp/aethon_test_data/observations /tmp/aethon_test_data/tmp
          python backend/scripts/generate_synthetic_benchmark.py --output-dir /tmp/aethon_test_data --seed 42 --dataset-id ci_bench --verify

      - name: Start FastAPI backend in background
        env:
          DATA_DIR: /tmp/aethon_test_data
          OBSERVATIONS_DIR: /tmp/aethon_test_data/observations
          TEMP_UPLOAD_DIR: /tmp/aethon_test_data/tmp
          DB_PATH: /tmp/aethon_test_data/aethon_test.db
          AETHON_ALLOW_ORIGINS: http://localhost:5173
          ENVIRONMENT: test
          LOG_LEVEL: INFO
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir backend > /tmp/fastapi.log 2>&1 &
          echo "FastAPI background PID: $!"

      - name: Wait for backend health readiness
        run: |
          echo "Waiting for http://127.0.0.1:8000/api/health readiness..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/api/health > /dev/null; then
              echo "FastAPI health check passed on attempt $i!"
              curl -s http://127.0.0.1:8000/api/health
              break
            fi
            echo "Attempt $i: server not ready yet, sleeping 1s..."
            sleep 1
          done
          if ! curl -s -f http://127.0.0.1:8000/api/health > /dev/null; then
            echo "FastAPI failed to become ready in 30 seconds. Log output:"
            cat /tmp/fastapi.log
            exit 1
          fi

      - name: Run live contract and connectivity suite
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm test

      - name: Run frontend smoke build
        run: npm run build

      - name: Clean up processes and temporary data
        if: always()
        run: |
          pkill -f "uvicorn" || true
          rm -rf /tmp/aethon_test_data /tmp/fastapi.log
